<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <defs>
    <pattern id="kudosDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#D9D9E1" />
    </pattern>
    <filter id="kudosShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="6" stdDeviation="6" flood-color="#2b2b38" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- FigJam-style canvas -->
  <rect x="0" y="0" width="900" height="900" rx="18" fill="#F5F5F7" />
  <rect x="0" y="0" width="900" height="900" rx="18" fill="url(#kudosDots)" />

  <!-- Title -->
  <text x="40" y="76" font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive,sans-serif" font-size="46" font-weight="700" fill="#2C2C34" transform="rotate(-1.5 40 76)">Kudos</text>
  <path d="M40 92 Q 96 106 152 92 T 262 92" fill="none" stroke="#FF7262" stroke-width="5" stroke-linecap="round" transform="rotate(-1.5 40 92)" />

  <!-- Multiplayer cursor -->
  <g transform="translate(720,32)">
    <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" transform="scale(1.5)" fill="#FF7262" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round" />
    <rect x="24" y="20" width="90" height="30" rx="15" fill="#FF7262" />
    <text x="69" y="40" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Mariana</text>
  </g>

  <!-- Sparkle accents -->
  <g fill="#4FA6A0" opacity="0.85">
    <path d="M858 470 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" />
  </g>
  <g fill="#8C6BFF" opacity="0.8">
    <path d="M420 44 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 z" />
  </g>
  <g fill="#D8677A" opacity="0.8">
    <path d="M32 470 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5 z" />
  </g>

  <!-- Note 1 -->
  <g transform="rotate(-3 230 320)">
    <rect x="40" y="140" width="380" height="360" rx="8" fill="#FFE066" stroke="#EBC94A" stroke-width="1" filter="url(#kudosShadow)" />
    <path d="M380 140 L420 140 L420 180 Z" fill="#F0CD52" />
    <text font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive,sans-serif" font-size="23" font-weight="600" fill="#4A3510">
      <tspan x="68" y="210">Kudos to Mariana</tspan>
      <tspan x="68" y="244">for finishing up</tspan>
      <tspan x="68" y="278">most of the</tspan>
      <tspan x="68" y="312">accordion tasks</tspan>
      <tspan x="68" y="346">and writing all</tspan>
      <tspan x="68" y="380">the docs for it!</tspan>
    </text>
    <circle cx="370" cy="460" r="24" fill="#FFFDF8" stroke="#EBC94A" stroke-width="1.5" />
    <text x="370" y="469" font-size="22" text-anchor="middle" fill="#D8455A">&#10084;</text>
  </g>

  <!-- Note 2 -->
  <g transform="rotate(3 650 290)">
    <rect x="460" y="110" width="380" height="360" rx="8" fill="#FFA8C5" stroke="#EF8AAE" stroke-width="1" filter="url(#kudosShadow)" />
    <path d="M800 110 L840 110 L840 150 Z" fill="#F290AE" />
    <text font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive,sans-serif" font-size="23" font-weight="600" fill="#5C2438">
      <tspan x="488" y="180">Mapi &amp; Mariana &#8212;</tspan>
      <tspan x="488" y="214">grinding on the</tspan>
      <tspan x="488" y="248">accordions to</tspan>
      <tspan x="488" y="282">ship before the</tspan>
      <tspan x="488" y="316">Canada release</tspan>
      <tspan x="488" y="350">&#128170;</tspan>
    </text>
    <circle cx="790" cy="430" r="24" fill="#FFFDF8" stroke="#EF8AAE" stroke-width="1.5" />
    <text x="790" y="439" font-size="22" text-anchor="middle" fill="#D8455A">&#10084;</text>
  </g>

  <!-- Note 3 -->
  <g transform="rotate(-2 440 680)">
    <rect x="250" y="500" width="380" height="360" rx="8" fill="#C9B6FF" stroke="#A98FEF" stroke-width="1" filter="url(#kudosShadow)" />
    <path d="M590 500 L630 500 L630 540 Z" fill="#B49CF2" />
    <text font-family="'Segoe Print','Comic Sans MS','Bradley Hand',cursive,sans-serif" font-size="23" font-weight="600" fill="#372468">
      <tspan x="278" y="580">Kudos to Mariana</tspan>
      <tspan x="278" y="614">for smooth work</tspan>
      <tspan x="278" y="648">on the Accordions</tspan>
      <tspan x="278" y="682">Revamp! &#127881;</tspan>
    </text>
    <circle cx="580" cy="820" r="24" fill="#FFFDF8" stroke="#A98FEF" stroke-width="1.5" />
    <text x="580" y="829" font-size="22" text-anchor="middle" fill="#D8455A">&#10084;</text>
  </g>
</svg>
